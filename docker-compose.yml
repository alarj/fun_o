version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: funo_nginx
    depends_on:
      - fastapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend_dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      default:
        aliases:
          - fun-o.eu

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: funo_fastapi
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped

  testing:
    image: locustio/locust:2.29.1
    container_name: funo_testing
    profiles: ["testing"]
    depends_on:
      - nginx
      - fastapi
    working_dir: /mnt/locust
    volumes:
      - ./testing/load:/mnt/locust
    entrypoint: ["locust"]

networks:
  default:
    name: funo_net
