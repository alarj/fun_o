version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: funo_nginx
    depends_on:
      - fastapi
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend_dist:/usr/share/nginx/html:ro
    restart: unless-stopped

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: funo_fastapi
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped

networks:
  default:
    name: funo_net