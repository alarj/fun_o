apply plugin: 'com.android.application'

def resolveConfigValue = { String propName, String envName, def defaultValue = null ->
    if (project.hasProperty(propName)) {
        return project.property(propName)
    }
    def envValue = System.getenv(envName)
    if (envValue != null && String.valueOf(envValue).trim()) {
        return envValue
    }
    return defaultValue
}

def resolveIntConfigValue = { String propName, String envName, int defaultValue ->
    return Integer.parseInt(String.valueOf(resolveConfigValue(propName, envName, defaultValue)).trim())
}

def funoVersionCode = resolveIntConfigValue("funoVersionCode", "FUNO_VERSION_CODE", 20500)
def funoVersionName = String.valueOf(resolveConfigValue("funoVersionName", "FUNO_VERSION_NAME", "2.5")).trim()
def funoReleaseStoreFile = String.valueOf(resolveConfigValue("funoReleaseStoreFile", "FUNO_RELEASE_STORE_FILE", "")).trim()
def funoReleaseStorePassword = String.valueOf(resolveConfigValue("funoReleaseStorePassword", "FUNO_RELEASE_STORE_PASSWORD", "")).trim()
def funoReleaseKeyAlias = String.valueOf(resolveConfigValue("funoReleaseKeyAlias", "FUNO_RELEASE_KEY_ALIAS", "")).trim()
def funoReleaseKeyPassword = String.valueOf(resolveConfigValue("funoReleaseKeyPassword", "FUNO_RELEASE_KEY_PASSWORD", "")).trim()
def hasReleaseSigning = funoReleaseStoreFile && funoReleaseStorePassword && funoReleaseKeyAlias && funoReleaseKeyPassword

android {
    namespace "ee.funo.competitor"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ee.funo.competitor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode funoVersionCode
        versionName funoVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(funoReleaseStoreFile)
                storePassword funoReleaseStorePassword
                keyAlias funoReleaseKeyAlias
                keyPassword funoReleaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
