<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./assets/competitor.css" />
    <title>fun_o</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    
  </head>
  <body>
    <div class="wrap">
      <div class="card" id="mainCard" style="display:none;">
        <div class="mainHead">
          <div class="mainHeadLeft">
            <div class="mainCompName" id="competitionLine">-</div>
            <div class="mainCompDesc" id="competitionDescLine">-</div>
            <div class="mainAlias" id="userLine">- - -</div>
          </div>
          <div class="mainHeadRight">
            <button id="switchCompetitionBtn" class="smallActionBtn"></button>
            <select id="langSelect" class="langCompact">
              <option value="et">ET</option>
              <option value="en">EN</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card answerCardBig" id="answerCard" style="display:none;">
        <div class="topRow" style="margin-bottom:10px;">
          <button id="showKpBtn" style="width:190px;"></button>
          <button id="mapBtn" style="width:190px; display:none;"></button>
          <div class="grow"></div>
        </div>
        <label id="checkpointSelectLabel" for="checkpointSelect"></label>
        <select id="checkpointSelect"></select>

        <div id="questionBlock" style="display:none; margin-top:14px;">
          <div id="answerMsg"></div>
          <h2 id="questionText">-</h2>
          <div style="font-size:20px; color:#4f5a61; margin-bottom:10px;" id="questionMeta">-</div>

          <div id="singleChoiceBlock" style="display:none;"></div>

          <div id="textBlock" style="display:none;">
            <textarea id="textAnswer" rows="4"></textarea>
            <div style="height:10px"></div>
            <button id="textSubmitBtn"></button>
          </div>
        </div>
      </div>

      <div class="card myResCard" id="myResultsCard">
        <div id="myResultsCollapsed" class="myResCollapsed">
          <div id="myResultsProgress" class="myResProgress">-</div>
          <button id="myResultsBtn"></button>
          <div class="myResInfoLine">
            <span id="introInviteText"></span> <a id="openIntroLinkFooter" href="#"></a>
          </div>
          <div class="myResInfoLine">
            <span id="termsAndLicenseLine"></span>
          </div>
        </div>
        <div id="myResExpanded" class="myResExpanded">
          <div class="myResHead">
            <h2 class="myResTitle" id="myResultsTitle"></h2>
            <button id="myResultsCloseBtn" class="secondary miniBtn"></button>
          </div>
          <table class="myResTable">
            <thead>
              <tr>
                <th><span id="myResThKp"></span> <button id="mrSortTitle" class="sortTiny">?</button></th>
                <th><span id="myResThTime"></span> <button id="mrSortTime" class="sortTiny">?</button></th>
                <th id="myResThPoints"></th>
              </tr>
            </thead>
            <tbody id="myResultsRows"></tbody>
          </table>
        </div>
      </div>
    </div>

      <div id="competitionPickerBackdrop" class="modalBackdrop">
      <div class="modal">
        <div class="subline" style="margin-bottom:4px;" id="competitionPickerLine1"></div>
        <div class="headline" id="competitionPickerName">-</div>
        <div style="height:6px"></div>
        <div style="font-size:20px; font-weight:700; margin-bottom:8px;" id="competitionPickerLine2"></div>
        <div style="height:8px"></div>
        <button id="openJoinByCodeBtn" class="secondary"></button>
        <div style="height:8px"></div>
        <button id="closeCompetitionPickerBtn" class="secondary"></button>
      </div>
    </div>

    <div id="joinByCodeBackdrop" class="modalBackdrop">
      <div class="modal">
        <div class="joinLangRow">
          <select id="joinLangSelect" class="joinLangSelect"></select>
        </div>
        <h3 id="joinModalTitle"></h3>
        <label id="joinCodeLabel" for="joinCode"><span class="reqStar">*</span></label>
        <input id="joinCode" type="text" />
        <label id="joinAliasLabel" for="joinAlias"><span class="reqStar">*</span></label>
        <input id="joinAlias" type="text" maxlength="120" />
        <label id="joinEmailLabel" for="joinEmail"></label>
        <input id="joinEmail" type="email" maxlength="320" />
        <div style="height:8px"></div>
        <button id="joinBtn"></button>
        <div id="joinIntroCta" class="introCta">
          <span id="joinIntroText"></span>
          <a id="openIntroLink" href="#"></a>
        </div>
        <div id="joinCloseWrap" style="display:none; margin-top:8px;">
          <button id="closeJoinByCodeBtn" class="secondary"></button>
        </div>
        <div id="joinMsg"></div>
      </div>
    </div>
    <div id="joinTermsBackdrop" class="modalBackdrop">
      <div class="modal">
        <h3 id="joinTermsTitle"></h3>
        <div id="joinTermsCompName" class="headline">-</div>
        <div style="height:8px"></div>
        <div class="termsBody" id="joinTermsBody"></div>
        <div style="height:10px"></div>
        <button id="confirmJoinBtn"></button>
        <div style="height:8px"></div>
        <button id="backFromTermsBtn" class="secondary"></button>
        <div id="joinTermsMsg"></div>
      </div>
    </div>
    <div id="introBackdrop" class="modalBackdrop">
      <div class="modal introModal">
          <h3 id="introModalTitle" style="margin:0 0 10px 0; font-size:30px;"></h3>
        <div class="introBodyScroll">
          <div id="introBody" class="introBody"></div>
        </div>
        <div style="height:8px"></div>
        <div class="introActions">
          <button id="closeIntroBtn" class="secondary introCloseBtn"></button>
        </div>
      </div>
    </div>
    <div id="competitionTermsBackdrop" class="modalBackdrop">
      <div class="modal">
        <h3 id="competitionTermsTitle"></h3>
        <div id="competitionTermsBody" class="termsBody"></div>
        <div style="height:8px"></div>
        <button id="closeCompetitionTermsBtn" class="secondary"></button>
      </div>
    </div>

    <div id="feedbackBackdrop" class="modalBackdrop">
      <div id="feedbackModal" class="modal feedback-ok">
        <h3 id="feedbackTitle"></h3>
        <p id="feedbackBody" style="font-size:24px;"></p>
        <button id="feedbackCloseBtn"></button>
      </div>
    </div>

    <div id="compMapBackdrop" class="mapBackdrop">
      <div class="mapPanel">
        <div id="compMapCanvas"></div>
        <div id="compMapHeadingDebug" class="mapHeadingDebug"></div>
        <button id="compMapHeadingBtn" class="mapHeadingFab is-off" type="button" title="Heading-up">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"></circle>
            <path d="M12 6.2 L15.8 15.8 L12 14.2 L8.2 15.8 Z"></path>
          </svg>
        </button>
        <div class="mapActions">
          <button id="compMapShowKpBtn"></button>
          <button id="compMapFollowBtn" class="secondary"></button>
          <button id="compMapInfoBtn" class="secondary iconBtn" title="Info">&#8505;</button>
          <button id="compMapLayerBtn" class="secondary iconBtn" title="" style="display:none;">
            <svg class="layerIconSvg" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 2 1 7l11 5 9-4.09V17h2V7L12 2Zm0 12L1 9v3l11 5 11-5V9l-11 5Zm0 5L1 14v3l11 5 11-5v-3l-11 5Z"/>
            </svg>
          </button>
          <button id="compMapCloseBtn" class="secondary iconBtn" title="Sulge">&#10005;</button>
        </div>
      </div>
    </div>
    <div id="compMapLayerBackdrop" class="modalBackdrop">
      <div class="modal">
        <h3 id="compMapLayerTitle"></h3>
        <div id="compMapLayerMsg"></div>
        <div id="compMapLayerList" class="mapLayerList"></div>
        <div style="height:8px"></div>
        <button id="compMapLayerCloseBtn" class="secondary"></button>
      </div>
    </div>

    <div id="myAnswerDetailBackdrop" class="modalBackdrop">
      <div class="modal">
        <div class="myResHead" style="margin-bottom:6px;">
          <h3 id="myAnswerDetailTitle" style="margin:0; font-size:30px;"></h3>
          <button id="myAnswerDetailCloseBtn" class="secondary miniBtn"></button>
        </div>
        <div id="myAnswerQuestion" style="font-size:30px; font-weight:800;"></div>
        <ul id="myAnswerVariants" class="ansList"></ul>
        <div id="myAnswerSubmittedAt" style="margin-top:8px; font-size:24px; color:#525e64;"></div>
        <div id="myAnswerPoints" style="margin-top:6px; font-size:24px; color:#525e64;"></div>
        <div id="myAnswerResponders" style="margin-top:6px; font-size:24px; color:#525e64;"></div>
        <div id="myAnswerCorrectPct" style="margin-top:6px; font-size:24px; color:#525e64;"></div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script
      src="https://unpkg.com/proj4@2.11.0/dist/proj4.js"
      integrity="sha256-SXX79BH6wYQsW5HTYtMj0/AcoMtSOFouohl5D/qiCoA="
      crossorigin=""
    ></script>
    <script
      src="https://unpkg.com/proj4leaflet@1.0.2/src/proj4leaflet.js"
      integrity="sha256-/bf+R9zVlOfIMNDuNpTviLQDJTcmjcLztY9JodcWHBI="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
    <script src="./assets/competitor-core.js"></script>
    <script src="./assets/competitor-map.js"></script>
    <script src="./assets/competitor-main.js"></script>
  </body>
</html>
