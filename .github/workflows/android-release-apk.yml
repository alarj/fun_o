name: Android Bundled Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android versionName (for example 2.5 or 2.5.1)
        required: true
        default: "2.5"
      version_code:
        description: Android versionCode (must always increase, for example 20500 or 20501)
        required: true
        default: "20500"

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    env:
      FUNO_COMPETITOR_API_BASE_URL: https://fun-o.eu
      FUNO_VERSION_NAME: ${{ inputs.version_name }}
      FUNO_VERSION_CODE: ${{ inputs.version_code }}
      FUNO_RELEASE_STORE_FILE: funo-upload-key.jks
      FUNO_RELEASE_STORE_PASSWORD: ${{ secrets.FUNO_RELEASE_STORE_PASSWORD }}
      FUNO_RELEASE_KEY_ALIAS: ${{ secrets.FUNO_RELEASE_KEY_ALIAS }}
      FUNO_RELEASE_KEY_PASSWORD: ${{ secrets.FUNO_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install npm dependencies
        run: npm ci

      - name: Restore Android upload keystore
        shell: bash
        env:
          FUNO_RELEASE_KEYSTORE_BASE64: ${{ secrets.FUNO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$FUNO_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/funo-upload-key.jks

      - name: Sync Capacitor Android in bundled release mode
        run: npm run cap:sync:android:bundled:release

      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
