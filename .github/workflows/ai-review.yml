name: Automaatne Tasuta AI Code Review

on:
  pull_request:
    types: [opened, synchronize] # Käivitub alati, kui PR avatakse või sinna koodi juurde pushitakse

jobs:
  gemini_review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Vajalik, et AI saaks kommentaare kirjutada

    steps:
      - name: Checkout kood
        uses: actions/checkout@v4

      - name: Google Gemini Code Review
        uses: uanderson/gemini-review-action@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: "gemini-1.5-flash" # Kasutame kiiret ja tasuta mudelit
          language: "et" # Palume AI-l kirjutada kommentaarid eesti keeles!
