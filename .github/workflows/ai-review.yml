name: Automaatne tasuta AI (gemini) code review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout kood
        uses: actions/checkout@v4

      - name: Gemini AI ülevaatus
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: "gemini-flash-latest"  # Kiire ja tasuta paketi mudel
          # 1. KÄSK: Vaata iga faili eraldi, et suured SQL paketid läbi mahuksid
          completions: "per-file"
          # 2. JULGEOLEK: Kui mõni SQL stub on absurdselt pikk, piirame tokenite arvu faili kohta,
          # et tasuta API päring kokku ei jookseks (vaikeväärtus võib muidu üle ujutada)
          max-tokens: 4000
          prompt: "Palun tee sellele koodimuudatusele põhjalik ülevaatus. Kirjuta kogu tagasiside, märkused ja soovitused rangelt eesti keeles!"
