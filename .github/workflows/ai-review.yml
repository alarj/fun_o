name: Automaatne tasuta AI (gemini) code review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout kood
        uses: actions/checkout@v4

      - name: Gemini AI ülevaatus
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: "gemini-flash-latest"  # Kiire ja tasuta paketi mudel
         # 1. PARANDUS: Ei saada terveid faile kaasa, vaatab ainult muudetud ridu
          add-files: false
          # 2. PARANDUS: Vähendame lisaridade (konteksti) mahtu muudetud ridade ümber
          context-lines: 1
          prompt: "Palun tee sellele koodimuudatusele põhjalik ülevaatus. Kirjuta kogu tagasiside, märkused ja soovitused rangelt eesti keeles!"
